<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00f5ff">
  <meta name="description" content="NexaRun — A cyberpunk 3D endless runner. Swipe to dodge, jump, and collect coins.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexaRun">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <title>NexaRun — Infinite Cyber Sprint</title>
</head>
<body>
  <canvas id="renderCanvas" tabindex="1"></canvas>

  <!-- Loading Screen -->
  <div id="loading-screen" class="ui-overlay">
    <div class="loading-content">
      <h1 class="game-title"><span class="title-nexa">NEXA</span><span class="title-run">RUN</span></h1>
      <div class="loading-bar-track"><div class="loading-bar" id="loading-bar"></div></div>
      <p class="loading-text">INITIALIZING SYSTEMS...</p>
    </div>
  </div>

  <!-- Main Menu -->
  <div id="main-menu" class="ui-overlay ui-hidden"></div>

  <!-- Shop Screen -->
  <div id="shop-screen" class="ui-overlay ui-hidden">
    <div class="menu-card shop-card">
      <h2 class="menu-title">SHOP</h2>
      <div class="hud-stat" style="margin: 0 auto 1.5rem; justify-content: center;">
        <span class="hud-label">COINS</span>
        <span class="hud-value" id="shop-coins-display">0</span>
      </div>
      
      <div class="skin-list" id="shop-skin-list">
        <!-- populated by TS -->
      </div>
      
      <button id="btn-shop-close" class="btn-neon btn-secondary" type="button" style="margin-top: 2rem;">
        BACK TO MENU
      </button>
    </div>
  </div>


  <!-- Shop Screen ... -->
  
  <!-- Pause Screen -->
  <div id="pause-screen" class="ui-overlay ui-hidden">
    <div class="menu-card gameover-card">
      <h2 class="menu-title">PAUSED</h2>
      
      <div class="gameover-buttons" style="margin-top: 2rem;">
        <button id="btn-resume" class="btn-neon btn-play" type="button">
          ▶ RESUME
        </button>
        <button id="btn-quit" class="btn-neon btn-secondary" type="button">
          MAIN MENU
        </button>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="ui-hidden">
    <div class="hud-top">
      <div class="hud-stats">
        <div class="hud-stat">
          <span class="hud-label">SCORE</span>
          <span class="hud-value" id="hud-score">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">COINS</span>
          <span class="hud-value" id="hud-coins">0</span>
        </div>
        <div class="hud-stat">
          <span class="hud-label">LIVES</span>
          <span class="hud-value" id="hud-lives">3</span>
        </div>
      </div>
      <button id="btn-pause" class="btn-icon" aria-label="Pause Game">⏸</button>
    </div>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="ui-overlay ui-hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
